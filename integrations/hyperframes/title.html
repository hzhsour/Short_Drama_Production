<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <script src="./gsap.min.js"></script>
    <style>
      @font-face { font-family: "ShortDramaLocal"; src: url("./__FONT_URL__"); font-style: normal; font-weight: 400; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: #0c1424; }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "ShortDramaLocal", sans-serif; color: #f4f4f5; }
      #rule { width: 22%; height: 4px; background: #e0b979; margin-bottom: 36px; }
      #title { max-width: 78%; font-size: __FONT_SIZE__px; line-height: 1.45; font-weight: 600; text-align: center; overflow-wrap: anywhere; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__" data-fps="__FPS__">
      <div id="rule" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="0"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="1">__TITLE__</h1>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.25 }, 0);
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25 }, 0.05);
      tl.to("#root", { opacity: 0, duration: 0.2 }, __FADE_OUT__);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
